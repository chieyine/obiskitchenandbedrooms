<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFCFB"/>
      <stop offset="0.55" stop-color="#F3EDE4"/>
      <stop offset="1" stop-color="#D1BFA4"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="20%" r="65%">
      <stop offset="0" stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="rgba(0,0,0,0.16)"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#shine)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="78" width="1056" height="474" fill="rgba(253,252,251,0.82)" stroke="rgba(51,49,46,0.14)" stroke-width="2"/>
  </g>

  <g fill="#33312E">
    <text x="120" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="-1">
      Obis Kitchen &amp; Bedrooms
    </text>
    <text x="120" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="34" opacity="0.86">
      Fitted Kitchens · Wardrobes · Media Walls
    </text>
    <text x="120" y="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" opacity="0.72">
      Measured properly. Built to fit. Finished cleanly.
    </text>

    <g opacity="0.9">
      <rect x="120" y="390" width="420" height="2" fill="rgba(51,49,46,0.18)"/>
      <text x="120" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" letter-spacing="3" opacity="0.65">
        OBISKITCHENBEDROOMS.CO.UK
